name: Verify FORMA
on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-source:
    name: Publish approved source and evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract the approved FORMA source bundle
        shell: python
        run: |
          import base64, io, pathlib, zipfile
          bundle = ""
          allowed = ("source/", "verification/")
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(bundle))) as archive:
              for item in archive.infolist():
                  name = item.filename
                  assert not pathlib.PurePosixPath(name).is_absolute()
                  assert ".." not in pathlib.PurePosixPath(name).parts
                  assert name.startswith(allowed) or name in ("README.md", ".gitignore")
                  target = pathlib.Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
      - name: Commit approved files
        run: |
          git add -- source verification README.md .gitignore
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish FORMA source, tests and verification evidence"
            git push origin HEAD:main
          fi
  domain:
    needs: publish-source
    name: Unit, integration and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run all xUnit tests
        run: dotnet test Forma.sln -c Debug --logger "trx;LogFileName=results.trx"
        working-directory: source
      - name: Install coverage tool
        run: dotnet tool install --global coverlet.console --version 6.0.4
      - name: Measure scoped coverage
        run: bash tests/measure-coverage.sh
        working-directory: source
      - name: Build release website
        run: dotnet publish src/Forma.Web/Forma.Web.csproj -c Release -o ../published
        working-directory: source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-and-coverage
          path: |
            source/**/TestResults/**
            source/TestResults/coverage/**
  browsers:
    needs: publish-source
    name: Browser workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: source/tests/e2e
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: source/tests/e2e
      - name: Verify live Pages workflows
        run: npx playwright test --workers=2 --reporter=list,html
        working-directory: source/tests/e2e
        env:
          FORMA_E2E_URL: https://nurzhigittt.github.io/forma-habits/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: source/tests/e2e/playwright-report/
