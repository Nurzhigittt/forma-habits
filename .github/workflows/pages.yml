name: Publish Forma
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: forma-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Extract compiled website
        run: |
          unzip -q Forma-Public-Deploy.zip -d published
          test -s published/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: published
      - uses: actions/deploy-pages@v4
        id: deployment
